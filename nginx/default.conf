server {
  listen 80;
  listen [::]:80;

  absolute_redirect off;

  root /usr/share/nginx/html;
  index index.html;

  # The public origin is HTTPS on the non-www host. Preserve the path while
  # collapsing protocol and host aliases before static routing.
  if ($host = www.{team}fanzone.com) {
    return 301 https://{team}fanzone.com$request_uri;
  }
  if ($http_x_forwarded_proto = http) {
    return 301 https://{team}fanzone.com$request_uri;
  }

  location ~ ^(.+)/$ {
    return 301 https://{team}fanzone.com$1$is_args$args;
  }

  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_types application/json;

  # ticket-sync atomically publishes only validated JSON beneath current/.
  # This prefix location takes precedence over extension regex locations, so
  # mounted content is served as inert data and is never interpreted.
  location ^~ /data/tickets/ {
    alias /srv/ticket-data/current/;
    autoindex off;
    default_type application/json;
    types {
      application/json json;
    }
    add_header Cache-Control "public, max-age=60, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Provider retention differs by adapter and is not yet approved. Do not
    # add stale-if-error here; the sync process enforces retention itself.
    error_page 404 = @ticket_data_unavailable;
  }

  location @ticket_data_unavailable {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 404 '{"error":"ticket_snapshot_unavailable"}\n';
  }

  location ^~ /data/eventspy-mirror/ {
    alias /srv/eventspy-mirror/;
    autoindex off;
    default_type application/json;
    types { application/json json; }
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    error_page 404 = @eventspy_mirror_unavailable;
  }

  location @eventspy_mirror_unavailable {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 404 '{"error":"eventspy_mirror_unavailable"}\n';
  }

  location / {
    try_files $uri $uri/index.html =404;
  }

  # Astro fingerprints compiled assets in /_astro/, so they are safe to cache forever.
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Public assets keep stable names and must remain revalidatable after editorial updates.
  location ~* \.(?:avif|webp|png|jpe?g|gif|svg|css|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;

    # Never retain a missing static asset: it may be added by the next deploy.
    error_page 404 = @static_not_found;
  }

  location @static_not_found {
    add_header Cache-Control "no-store" always;
    return 404;
  }
}
