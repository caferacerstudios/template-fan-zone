services:
  web:
    image: nginx:alpine
    container_name: {team}fanzone-web
    ports:
      - "4322:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Snapshot state is independent of immutable site releases. Select the
      # dev or production host path with the operator-owned Compose env file.
      - ${TICKET_DATA_ROOT:-./runtime/tickets}:/srv/ticket-data:ro
      - ${EVENTSPY_MIRROR_ROOT:-./runtime/eventspy-mirror/public}:/srv/eventspy-mirror:ro
    restart: unless-stopped

  ticket-sync:
    profiles: ["ticket-sync"]
    build:
      context: .
      dockerfile: deployment/ticket-sync/Dockerfile
    image: ${TICKET_SYNC_IMAGE:-{team}fanzone-ticket-sync:local}
    env_file:
      - ${TICKET_SYNC_ENV_FILE:-deployment/ticket-sync/example.env}
    environment:
      TICKETS_OUTPUT_DIR: /srv/ticket-data/current
      EVENTSPY_HISTORY_ROOT: /srv/eventspy
    volumes:
      - ${TICKET_DATA_ROOT:-./runtime/tickets}:/srv/ticket-data
      - ${EVENTSPY_DATA_ROOT:-./runtime/eventspy}:/srv/eventspy:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: "no"

  eventspy-collector:
    profiles: ["eventspy-collector"]
    build:
      context: .
      dockerfile: deployment/eventspy-collector/Dockerfile
      args:
        BROWSER_BASE_IMAGE: ${BROWSER_BASE_IMAGE:?operator-reviewed immutable browser image digest required}
    image: ${EVENTSPY_COLLECTOR_IMAGE:-{team}fanzone-eventspy-collector:local}
    pull_policy: never
    env_file:
      - ${EVENTSPY_ENV_FILE:-deployment/eventspy-collector/example.env}
    environment:
      EVENTSPY_RUNTIME_ROOT: /srv/eventspy
    volumes:
      - ${EVENTSPY_DATA_ROOT:-./runtime/eventspy}:/srv/eventspy
    read_only: true
    shm_size: 256m
    pids_limit: 256
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "1000:1000"
    init: true
    restart: "no"
