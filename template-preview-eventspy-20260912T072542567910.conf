server {
# BEGIN FANZONE EVENTSPY FEEDS
location ^~ /data/eventspy-mirror/broncos/ {
  alias /srv/fanzone-eventspy/broncos/;
  autoindex off;
  default_type application/json;
  types { application/json json; }
  add_header Cache-Control "no-store" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Robots-Tag "noindex" always;
}
location ^~ /data/eventspy-mirror/chiefs/ {
  alias /srv/fanzone-eventspy/chiefs/;
  autoindex off;
  default_type application/json;
  types { application/json json; }
  add_header Cache-Control "no-store" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Robots-Tag "noindex" always;
}
location ^~ /data/eventspy-mirror/packers/ {
  alias /srv/fanzone-eventspy/packers/;
  autoindex off;
  default_type application/json;
  types { application/json json; }
  add_header Cache-Control "no-store" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Robots-Tag "noindex" always;
}
location ^~ /data/eventspy-mirror/seahawks/ {
  alias /srv/fanzone-eventspy/seahawks/;
  autoindex off;
  default_type application/json;
  types { application/json json; }
  add_header Cache-Control "no-store" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Robots-Tag "noindex" always;
}
location ^~ /data/eventspy-mirror/vikings/ {
  alias /srv/fanzone-eventspy/vikings/;
  autoindex off;
  default_type application/json;
  types { application/json json; }
  add_header Cache-Control "no-store" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Robots-Tag "noindex" always;
}
# END FANZONE EVENTSPY FEEDS

    listen 80;
    server_name _;
    absolute_redirect off;
    root /site/dist;
    index index.html;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        try_files $uri $uri/ =404;
    }
}


